<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <!-- GitHub Pages serves this file for any path it can't find, so a deep link -->
  <!-- like /blog/some-post/ lands here and the JS forwards it to the same path -->
  <!-- on the new site. The <meta refresh> is the no-JS fallback to the root. -->
  <link rel="canonical" href="https://saumilp.dev/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://saumilp.dev/">
  <script>
    location.replace("https://saumilp.dev" + location.pathname + location.search + location.hash);
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://saumilp.dev/">saumilp.dev</a>.</p>
</body>
</html>
