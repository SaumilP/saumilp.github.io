<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <!-- The canonical site now lives on Vercel at https://saumilp.dev. This page -->
  <!-- forwards any visitor (and GitHub Pages serves 404.html for deep links, so -->
  <!-- the JS below preserves the full path + query + hash on the way over). -->
  <link rel="canonical" href="https://saumilp.dev/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://saumilp.dev/">
  <script>
    location.replace("https://saumilp.dev" + location.pathname + location.search + location.hash);
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://saumilp.dev/">saumilp.dev</a>.</p>
</body>
</html>
